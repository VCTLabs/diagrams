[tox]
envlist = py3{9,10,11,12,13,14}-{linux}
skip_missing_interpreters = true
isolated_build = true
skipsdist = true

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
PLATFORM =
    ubuntu-22.04: linux
    ubuntu-24.04: linux

[build]
deps =
    pip>=23.1
    build
    twine

[testenv]
setenv = PYTHONPATH = {toxinidir}

passenv =
    pythonLocation
    PYTHON
    CI
    OS
    GITHUB*
    PIP_DOWNLOAD_CACHE

deps =
    pip>=23.1
    pytest
    pytest-cov
    coverage[toml]
    coverage_python_version
    -e .

commands =
    python -m pytest -v tests/ --capture={posargs:"fd"} --cov=diagrams --cov-branch --cov-report term-missing

[testenv:dev]
passenv =
    pythonLocation
    PYTHON
    DISPLAY
    XAUTHORITY
    HOME
    USERNAME
    USER
    CI
    XDG_*
    GITHUB*
    PIP_DOWNLOAD_CACHE
    PYTHONIOENCODING

setenv = PYTHONPATH = .

allowlist_externals = bash

deps =
    pip>=23.1
    -rrequirements.txt

commands =
    bash ./autogen.sh

[testenv:lint]
passenv =
    pythonLocation
    PYTHON
    CI
    OS
    GITHUB*
    PIP_DOWNLOAD_CACHE

setenv = PYTHONPATH = {toxinidir}

deps =
    pip>=23.1
    -r requirements.txt
    pylint

commands =
    pylint \
    --ignore=alibabacloud,aws,azure,base,custom,digitalocean,elastic,embedded,firebase,gcp,generic,ibm,k8s,oci,onprem,openstack,outscale,programming,saas \
    --fail-under=8.00 diagrams/ {posargs}

[testenv:mypy]
skip_install = true

setenv = PYTHONPATH = {toxinidir}

deps =
    pip>=23.1
    mypy
    -r requirements.txt

commands =
    python -m mypy --follow-imports=normal --install-types --non-interactive diagrams/ scripts/

[testenv:build]
skip_install = true

passenv =
    pythonLocation
    CI
    PYTHONIOENCODING
    PIP_DOWNLOAD_CACHE
    SETUPTOOLS_SCM_DEBUG

deps =
    {[build]deps}

commands =
    python -m build .
    twine check dist/*

[testenv:check]
skip_install = true
passenv = CI

deps =
    pip>=23.1

commands =
    python -m pip install diagrams --force-reinstall --pre --prefer-binary -f dist/
    diagrams -h
    #python -m pip show -f diagrams

[testenv:clean]
skip_install = true
allowlist_externals =
    bash

deps =
    pip>=23.1

commands =
    bash -c 'rm -rf build/ dist/ *.egg-info/ __pycache__'
