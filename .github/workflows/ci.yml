name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]

jobs:
  matrix_build:

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      PYTHONIOENCODING: utf-8
      PIP_DOWNLOAD_CACHE: ${{ github.workspace }}/../.pip_download_cache
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: [3.9, '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - name: Set git crlf/eol
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Deps for system pkgs
      run: |
        sudo apt-get -qq update
        # also round and inkscape
        sudo apt-get install -yqq graphviz imagemagick fonts-open-sans fontconfig xdg-utils

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Run tests
      run: |
        tox -- no
      env:
        PLATFORM: ${{ matrix.os }}

    - name: Build dist pkgs
      run: |
        tox -e build,check

    - name: Upload artifacts
      if: matrix.python-version == '3.9' && matrix.ubuntu-version == 'ubuntu-22.04'
      uses: actions/upload-artifact@v5
      with:
        name: timew-addons-packages
        path: dist
